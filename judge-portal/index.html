<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDEATHON Judge Portal</title>
<style>
:root{
  --bg:#f3f5fb;--card:#fff;--ink:#141a2e;--mut:#6a7389;--line:#e3e7f1;
  --pri:#4f46e5;--pri2:#7c3aed;--priSoft:#eef0ff;--ok:#12a150;--okSoft:#e4f6ec;--warn:#c27803;--warnSoft:#fff4dc;--bad:#d1342b;
  --inp:#f6f7fd;--shadow:0 1px 2px rgba(20,26,46,.05),0 8px 24px rgba(20,26,46,.06)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0f1c;--card:#151a2c;--ink:#eceffa;--mut:#9099b4;--line:#242b44;
  --pri:#8b85ff;--pri2:#b28bff;--priSoft:#1e2340;--ok:#4cd68b;--okSoft:#12301f;--warn:#f0b64a;--warnSoft:#33280f;--bad:#ff7d73;
  --inp:#1b2137;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
button:disabled{opacity:.6;cursor:default}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input,textarea{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
.hide{display:none!important}

/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--pri) 25%,transparent),transparent),radial-gradient(800px 500px at 100% 110%,color-mix(in srgb,var(--pri2) 22%,transparent),transparent)}
.authCard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow)}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));margin-bottom:14px}
.authCard h1{margin:0;font-size:24px}.authCard p{margin:4px 0 20px;color:var(--mut);font-size:14px}
.authCard label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:10px 0 2px}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topIn{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .logo{width:36px;height:36px;font-size:17px;margin:0;border-radius:11px;flex:none}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:980px;margin:0 auto;padding:18px 16px 80px}

/* judge */
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:18px;padding:18px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:18px}.hero p{margin:2px 0 0;opacity:.85;font-size:13px}
.hero .prog{flex:1;min-width:180px}
.pbar{height:9px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .3s}
.tools{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:180px}
.chips{display:flex;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 13px;border-radius:99px;font-size:13px}
.chip.on{background:var(--priSoft);color:var(--pri);border-color:var(--pri)}
.team{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.team.open{border-color:var(--pri)}
.thead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:14px}
.tinfo{flex:1;min-width:0}.tinfo b{display:block;font-size:16px}
.tinfo span{color:var(--mut);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--warnSoft);color:var(--warn)}
.pill.done{background:var(--okSoft);color:var(--ok)}
.arrow{flex:none;color:var(--mut);transition:transform .2s}.team.open .arrow{transform:rotate(180deg)}
.body{display:none;padding:4px 16px 18px;border-top:1px solid var(--line)}.team.open .body{display:block}
.mem{color:var(--mut);font-size:13px;margin:12px 0 4px}
.crit{padding:12px 0;border-bottom:1px dashed var(--line)}
.crow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.crow b{font-size:14.5px}.crow em{font-style:normal;color:var(--mut);font-size:12px;white-space:nowrap}
.cdesc{color:var(--mut);font-size:12px;margin:1px 0 8px}
.ctl{display:flex;gap:12px;align-items:center}
.ctl input[type=range]{flex:1;padding:0;height:6px;accent-color:var(--pri);background:transparent;border:0;box-shadow:none}
.ctl input[type=number]{width:78px;text-align:center;font-weight:700;font-size:16px;padding:8px}
.sum{display:flex;align-items:center;gap:14px;margin:14px 0 10px}
.sum .big{font-size:30px;font-weight:800;line-height:1}.sum .big small{font-size:14px;color:var(--mut);font-weight:600}
.sum .meter{flex:1;height:10px;background:var(--line);border-radius:10px;overflow:hidden}
.sum .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .25s}
.saveRow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.st{font-size:13px;color:var(--mut)}.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.tile small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.tile div{font-size:26px;font-weight:800;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:16px}
.lrow{display:grid;grid-template-columns:34px 1fr 90px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border:0}
.lrow .rk{font-weight:800;color:var(--mut);text-align:center}.lrow:nth-child(-n+3) .rk{color:var(--pri)}
.lrow b{font-size:14.5px}.lrow small{color:var(--mut);margin-left:6px}
.lbar{height:8px;border-radius:8px;background:var(--line);margin-top:6px;overflow:hidden}
.lbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.lrow .sc{text-align:right;font-size:18px;font-weight:800}.lrow .sc small{display:block;font-size:11px;font-weight:600;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
td.l,th.l{text-align:left}td.rem{white-space:normal;min-width:160px;text-align:left}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>

<section id="login" class="auth">
  <div class="authCard">
    <div class="logo">★</div>
    <h1>IDEATHON 3.0</h1>
    <p>Judge portal · CINTEL Student Association</p>
    <label for="u">Username</label>
    <input id="u" autocomplete="username" autocapitalize="none" placeholder="judge1">
    <label for="p">Passcode</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="••••••">
    <div class="err" id="lerr"></div>
    <button id="go" style="width:100%">Sign in</button>
  </div>
</section>

<div id="app" class="hide">
  <div class="top"><div class="topIn">
    <div class="brand"><div class="logo">★</div><div><b>IDEATHON 3.0</b><small id="who"></small></div></div>
    <button class="ghost" id="out">Sign out</button>
  </div></div>
  <main>
    <div id="judge" class="hide">
      <div class="hero">
        <div><h2>Idea Pitching Scorecard</h2><p>Preliminary round · 100 marks per team</p></div>
        <div class="prog"><b id="progTxt"></b><div class="pbar"><i id="progBar" style="width:0"></i></div></div>
      </div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search team or member…">
        <div class="chips" id="chips">
          <button class="chip on" data-f="all">All</button><button class="chip" data-f="todo">Pending</button><button class="chip" data-f="done">Scored</button>
        </div>
      </div>
      <div id="teams"></div>
    </div>

    <div id="admin" class="hide">
      <div class="tiles" id="tiles"></div>
      <div class="tabs">
        <button class="chip on" data-t="board">Leaderboard</button>
        <button class="chip" data-t="avg">Criteria averages</button>
        <button class="chip" data-t="all">All judge scores</button>
        <span style="flex:1"></span>
        <button class="ghost" id="refresh">Refresh</button>
        <button id="xls">Download Excel</button>
      </div>
      <div class="panel" id="vBoard"></div>
      <div class="panel tw hide" id="vAvg"></div>
      <div class="panel tw hide" id="vAll"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ====== CONFIG ======
const SUPABASE_URL = "https://ziavtupdsczjzrzuqttd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppYXZ0dXBkc2N6anpyenVxdHRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NTc5NzMsImV4cCI6MjEwNzUzMzk3M30.59NERK4ENmpnnXHUYPtxxhN47cLco78soE5gUHmPn20";
// ====================

const CR=[
 ["Innovation & Originality",25,"Uniqueness, creativity, novelty, differentiation"],
 ["Problem Identification & Relevance",20,"Clarity of the problem, importance, target users"],
 ["Proposed Solution & Approach",20,"How well the idea solves it; clarity of approach"],
 ["Feasibility & Practicality",15,"Realistic with available technology, time, resources"],
 ["Impact & Potential",10,"Benefits, real-world usefulness, future scope"],
 ["Pitching & Q&A",10,"Clarity, confidence, flow, time, answers to judges"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=(r,i)=>r["c"+(i+1)];
const filled=(r,i)=>val(r,i)!==null&&val(r,i)!==undefined&&val(r,i)!=="";
const has=r=>CR.some((_,i)=>filled(r,i));
const full=r=>CR.every((_,i)=>filled(r,i));
const total=r=>CR.reduce((a,_,i)=>a+(+val(r,i)||0),0);
const r2=x=>Math.round(x*100)/100;
const demo=new URLSearchParams(location.search).has("demo");
let me=null,cred=null,teams=[],filter="all";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}

// ---- API (demo mode uses in-memory data so the UI can be previewed without a database) ----
const mock={teams:["420","NeuroNova","CtrlPray","California Burrito","ACE","HomeTeam"].map((n,i)=>({id:i+1,name:n,members:"Member A, Member B, Member C"})),scores:{}};
async function rpc(fn,a){
  if(demo){
    if(fn==="portal_login"){if(a.p!=="demo")throw new Error("Invalid username or passcode");return{username:a.u,name:a.u==="admin"?"Admin":"Judge 1",is_admin:a.u==="admin"}}
    if(fn==="portal_get_teams")return mock.teams.map(t=>({...t,...(mock.scores[t.id]||{})}));
    if(fn==="portal_save_score"){mock.scores[a.team]={c1:a.v1,c2:a.v2,c3:a.v3,c4:a.v4,c5:a.v5,c6:a.v6,remarks:a.note};return{ok:true}}
    if(fn==="portal_admin_results")return Object.entries(mock.scores).map(([id,s])=>({team_id:+id,judge:"Judge 1",judge_username:"judge1",...s}));
  }
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:"POST",
    headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`,"Content-Type":"application/json"},body:JSON.stringify(a)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((d.message||"Request failed").replace(/^.*exception:?\s*/i,""));
  return d;
}

// ---- auth ----
async function login(){
  $("lerr").textContent="";$("go").disabled=true;
  try{
    const u=$("u").value.trim().toLowerCase(),p=$("p").value;
    me=await rpc("portal_login",{u,p});cred={u,p};
    sessionStorage.setItem("ide_cred",JSON.stringify(cred));start();
  }catch(e){$("lerr").textContent=e.message==="Failed to fetch"?"Cannot reach the server. Check your connection.":e.message}
  $("go").disabled=false;
}
function start(){
  $("login").classList.add("hide");$("app").classList.remove("hide");
  $("who").textContent=`${me.name}${me.is_admin?" · Admin":""}`;
  if(me.is_admin){$("admin").classList.remove("hide");loadAdmin()}
  else{$("judge").classList.remove("hide");loadTeams()}
}
$("go").onclick=login;$("p").onkeydown=e=>{if(e.key==="Enter")login()};$("u").onkeydown=e=>{if(e.key==="Enter")$("p").focus()};
$("out").onclick=()=>{sessionStorage.removeItem("ide_cred");location.reload()};

// ---- judge view ----
let openId=null;
async function loadTeams(){
  try{teams=await rpc("portal_get_teams",cred)}catch(e){toast(e.message);return}
  render();progress();
}
function progress(){
  const d=teams.filter(full).length;
  $("progTxt").textContent=`${d} of ${teams.length} teams fully scored`;
  $("progBar").style.width=(teams.length?d/teams.length*100:0)+"%";
}
function render(){
  const f=$("q").value.toLowerCase();
  const list=teams.filter(t=>(!f||(t.name+" "+t.members).toLowerCase().includes(f))&&
    (filter==="all"||(filter==="done"?full(t):!full(t))));
  $("teams").innerHTML=list.length?list.map(card).join(""):`<div class="panel" style="text-align:center;color:var(--mut)">No teams match.</div>`;
}
function card(t){
  const open=openId===t.id;
  return `<div class="team${open?" open":""}" data-id="${t.id}">
  <div class="thead"><div class="num">${t.id}</div>
    <div class="tinfo"><b>${esc(t.name)}</b><span>${esc(t.members)}</span></div>
    <span class="pill${full(t)?" done":""}">${full(t)?total(t)+" / 100":has(t)?"In progress":"Pending"}</span>
    <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></div>
  <div class="body">${open?body(t):""}</div></div>`;
}
function body(t){
  return `<div class="mem">Team members: ${esc(t.members)}</div>`+CR.map((c,i)=>{
    const v=val(t,i);
    return `<div class="crit"><div class="crow"><b>${esc(c[0])}</b><em>max ${c[1]}</em></div><div class="cdesc">${esc(c[2])}</div>
    <div class="ctl"><input type="range" min="0" max="${c[1]}" step="0.5" value="${v??0}" data-i="${i}">
    <input type="number" inputmode="decimal" min="0" max="${c[1]}" step="0.5" value="${v??""}" placeholder="–" data-i="${i}"></div></div>`}).join("")+
  `<div class="sum"><div class="big"><span class="tv">${has(t)?total(t):0}</span> <small>/ 100</small></div><div class="meter"><i style="width:${total(t)}%"></i></div></div>
   <textarea rows="2" placeholder="Remarks (optional)">${esc(t.remarks||"")}</textarea>
   <div class="saveRow"><span class="st">${has(t)?"Saved":"Not scored yet"}</span><button class="save">Save</button></div>`;
}
$("q").oninput=render;
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.f;
  document.querySelectorAll("#chips .chip").forEach(x=>x.classList.toggle("on",x===b));render()};
$("teams").addEventListener("click",e=>{
  if(e.target.closest(".save")){return saveCard(e.target.closest(".team"))}
  const h=e.target.closest(".thead");if(!h)return;
  const id=+h.parentElement.dataset.id;openId=openId===id?null:id;render();
  if(openId){const el=document.querySelector(`.team[data-id="${id}"]`);el&&el.scrollIntoView({block:"nearest",behavior:"smooth"})}
});
let timers={};
$("teams").addEventListener("input",e=>{
  const card=e.target.closest(".team");if(!card||!e.target.dataset.i&&e.target.tagName!=="TEXTAREA")return;
  const i=e.target.dataset.i;
  if(i!==undefined){ // keep slider and number box in sync, clamped to range
    const max=CR[i][1];let v=e.target.value;
    if(v!==""){v=Math.min(max,Math.max(0,+v));if(e.target.type==="number"&&+e.target.value>max)e.target.value=max}
    card.querySelectorAll(`[data-i="${i}"]`).forEach(x=>{if(x!==e.target)x.value=v});
  }
  let t=0;card.querySelectorAll('input[type=number]').forEach(n=>t+=Math.min(+n.max,+n.value||0));
  card.querySelector(".tv").textContent=t;card.querySelector(".meter i").style.width=t+"%";
  const s=card.querySelector(".st");s.textContent="Saving…";s.className="st";
  clearTimeout(timers[card.dataset.id]);timers[card.dataset.id]=setTimeout(()=>saveCard(card),900);
});
async function saveCard(card){
  const t=teams.find(x=>x.id==card.dataset.id),st=card.querySelector(".st");
  const v=[...card.querySelectorAll("input[type=number]")].map((n,i)=>n.value===""?null:Math.min(CR[i][1],Math.max(0,+n.value)));
  const note=card.querySelector("textarea").value;
  try{
    await rpc("portal_save_score",{u:cred.u,p:cred.p,team:t.id,v1:v[0],v2:v[1],v3:v[2],v4:v[3],v5:v[4],v6:v[5],note});
    v.forEach((x,i)=>t["c"+(i+1)]=x);t.remarks=note;
    st.textContent="Saved ✓";st.className="st ok";progress();
    const pill=card.querySelector(".pill");pill.textContent=full(t)?total(t)+" / 100":has(t)?"In progress":"Pending";pill.classList.toggle("done",full(t));
  }catch(err){st.textContent="Not saved: "+err.message;st.className="st bad"}
}

// ---- admin view ----
let res=[],tmap={};
async function loadAdmin(){
  try{
    const t=await rpc("portal_get_teams",cred);tmap={};t.forEach(x=>tmap[x.id]=x);
    res=await rpc("portal_admin_results",cred);renderAdmin();
  }catch(e){toast(e.message)}
}
function rows(){
  return Object.values(tmap).map(t=>{
    const rs=res.filter(r=>r.team_id==t.id&&has(r)),n=rs.length;
    const av=CR.map((_,i)=>n?rs.reduce((a,r)=>a+(+val(r,i)||0),0)/n:null);
    return{t,n,av,total:n?av.reduce((a,b)=>a+b,0):null};
  });
}
const ranked=()=>rows().sort((a,b)=>(b.total??-1)-(a.total??-1));
const f1=x=>x===null?"–":r2(x);
function renderAdmin(){
  const rk=ranked(),scored=rk.filter(r=>r.n).length,judges=new Set(res.map(r=>r.judge_username)).size;
  const top=rk[0]&&rk[0].n?rk[0]:null;
  $("tiles").innerHTML=`<div class="tile"><small>Judges active</small><div>${judges}</div></div>
   <div class="tile"><small>Teams scored</small><div>${scored}<span style="font-size:15px;color:var(--mut)"> / ${rk.length}</span></div></div>
   <div class="tile"><small>Total entries</small><div>${res.length}</div></div>
   <div class="tile"><small>Top team</small><div style="font-size:18px">${top?esc(top.t.name):"–"}</div></div>`;
  $("vBoard").innerHTML=`<h3>Leaderboard <small style="color:var(--mut);font-weight:500">(average of all judges, out of 100)</small></h3>`+
   rk.map((r,k)=>`<div class="lrow"><div class="rk">${k+1}</div><div><b>${esc(r.t.name)}</b><small>${r.n} judge${r.n===1?"":"s"}</small>
    <div class="lbar"><i style="width:${r.total||0}%"></i></div></div><div class="sc">${f1(r.total)}</div></div>`).join("");
  $("vAvg").innerHTML=`<h3>Average per criterion</h3><table><tr><th class="l">Team</th><th>Judges</th>${CR.map(c=>`<th>${esc(c[0])}<br>(${c[1]})</th>`).join("")}<th>Total</th></tr>`+
   rows().map(r=>`<tr><td class="l"><b>${esc(r.t.name)}</b></td><td>${r.n}</td>${r.av.map(x=>`<td>${f1(x)}</td>`).join("")}<td><b>${f1(r.total)}</b></td></tr>`).join("")+`</table>`;
  const sorted=res.slice().sort((a,b)=>a.team_id-b.team_id||a.judge_username.localeCompare(b.judge_username,undefined,{numeric:true}));
  $("vAll").innerHTML=`<h3>All judge scores</h3><table><tr><th class="l">Team</th><th class="l">Judge</th>${CR.map(c=>`<th>${esc(c[0])}<br>(${c[1]})</th>`).join("")}<th>Total</th><th class="l">Remarks</th></tr>`+
   sorted.map(r=>`<tr><td class="l"><b>${esc(tmap[r.team_id]?.name)}</b></td><td class="l">${esc(r.judge)}</td>${CR.map((_,i)=>`<td>${val(r,i)??""}</td>`).join("")}<td><b>${total(r)}</b></td><td class="rem">${esc(r.remarks)}</td></tr>`).join("")+`</table>`;
}
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-t]");if(!b)return;
  document.querySelectorAll(".tabs [data-t]").forEach(x=>x.classList.toggle("on",x===b));
  ["Board","Avg","All"].forEach(n=>$("v"+n).classList.toggle("hide",n.toLowerCase()!==b.dataset.t));
});
$("refresh").onclick=async()=>{await loadAdmin();toast("Updated")};
$("xls").onclick=()=>{
  const all=[["Team","Members","Judge",...CR.map(c=>`${c[0]} (Max ${c[1]})`),"Total (Max 100)","Remarks"]];
  res.slice().sort((a,b)=>a.team_id-b.team_id||a.judge_username.localeCompare(b.judge_username,undefined,{numeric:true}))
   .forEach(r=>all.push([tmap[r.team_id]?.name,tmap[r.team_id]?.members,r.judge,...CR.map((_,i)=>val(r,i)),total(r),r.remarks]));
  const av=[["Team","Judges scored",...CR.map(c=>`${c[0]} (Avg, Max ${c[1]})`),"Average Total (Max 100)"]];
  rows().sort((a,b)=>a.t.id-b.t.id).forEach(r=>av.push([r.t.name,r.n,...r.av.map(x=>x===null?"":r2(x)),r.total===null?"":r2(r.total)]));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(all),"All Scores");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(av),"Team Averages");
  XLSX.writeFile(wb,"IDEATHON_3.0_Judging_Results.xlsx");
};

// resume session
try{const c=JSON.parse(sessionStorage.getItem("ide_cred")||"null");
  if(c){cred=c;rpc("portal_login",c).then(m=>{me=m;start()}).catch(()=>sessionStorage.removeItem("ide_cred"))}}catch(e){}
</script>
</body>
</html>
